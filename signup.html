<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Bella | Signup</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">☕ La Bella</a
        ><button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#nav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="menu.html">Menu</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="reservation.html">Reservation</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#about">About Us</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#contact">Contact</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="login.html">Login</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="signup.html">Register</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container py-5">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item active">Signup</li>
        </ol>
      </nav>
      <div class="form-card mx-auto">
        <h2 class="fw-bold text-center mb-4">Create Account</h2>
        <form>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">First Name</label
              ><input class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Last Name</label
              ><input class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label
              ><input class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label
              ><input type="email" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Username</label
              ><input class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Password</label
              ><input type="password" class="form-control" required />
            </div>
            <div class="col-12 text-center">
              <button class="btn btn-danger px-5">Sign Up</button>
            </div>
          </div>
        </form>
        <p class="text-center mt-3">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </div>
    </div>
    <div class="date-time" id="dateTime"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
